{% import "macros.html" as m %}
<h1>{{ 'Editar usuário' if item else 'Novo usuário' }}</h1>
{% if modal %}{{ m.avisos() }}{% endif %}

<form class="cartao" method="post" action="{{ acao }}"
      {% if modal %}hx-post="{{ acao }}" hx-target="#modal-corpo" hx-swap="innerHTML"
      hx-disabled-elt="find button[type=submit]"{% endif %}>
  <input type="hidden" name="voltar" value="{{ voltar }}">
  <div class="linha">
    <div class="campo largo">
      <label for="u_nome">Nome</label>
      <input type="text" id="u_nome" name="nome" required value="{{ form.get('nome') or '' }}">
    </div>
    <div class="campo">
      <label for="u_login">Login</label>
      <input type="text" id="u_login" name="login" autocomplete="off" required value="{{ form.get('login') or '' }}">
    </div>
  </div>
  <div class="linha">
    <div class="campo">
      <label for="u_perfil">Perfil</label>
      <select id="u_perfil" name="perfil" required>
        {% for p in perfis %}<option value="{{ p }}" {% if form.get('perfil') == p %}selected{% endif %}>{{ p }}</option>{% endfor %}
      </select>
    </div>
    <div class="campo">
      <label for="u_senha">Senha</label>
      <input type="password" id="u_senha" name="senha" autocomplete="new-password"
             {% if not item %}required{% endif %} placeholder="{{ 'manter a atual' if item else '' }}">
    </div>
    <div class="campo checa auto">
      <input type="checkbox" id="u_ativo" name="ativo" {% if form.get('ativo') %}checked{% endif %}>
      <label for="u_ativo">Ativo</label>
    </div>
  </div>
  {% if item %}<p class="dica">Deixe a senha em branco para manter a atual.</p>{% endif %}
  <div class="acoes">
    <button class="botao so-icone" type="submit" title="Salvar" aria-label="Salvar">{{ m.icone('salvar') }}</button>
    {% if modal %}
    <button class="botao secundario so-icone" type="button" title="Cancelar" aria-label="Cancelar"
            onclick="document.getElementById('modal').close()">{{ m.icone('nao') }}</button>
    {% else %}
    <a class="botao secundario so-icone" href="{{ voltar }}" title="Cancelar" aria-label="Cancelar">{{ m.icone('nao') }}</a>
    {% endif %}
  </div>
</form>

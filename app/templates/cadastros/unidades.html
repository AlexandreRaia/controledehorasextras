{% extends "base.html" %}
{% block titulo %}Unidades{% endblock %}
{% block conteudo %}

<h1>Unidades</h1>
<p class="sub">Locais aos quais os funcionários são vinculados.</p>

<form class="cartao" method="post" action="{{ url_for('cadastros.unidade_salvar') }}">
  <input type="hidden" name="id" id="unidade_id">
  <div class="linha">
    <div class="campo">
      <label for="nome">Nome da unidade</label>
      <input type="text" id="nome" name="nome" required>
    </div>
  </div>
  <div class="acoes">
    <button class="botao" type="submit">Salvar</button>
    <button class="botao secundario" type="button" onclick="limpar()">Limpar</button>
  </div>
</form>

<div class="cartao tabela-rolagem">
  <table>
    <thead><tr><th>Nome</th><th>Ações</th></tr></thead>
    <tbody>
      {% for u in itens %}
      <tr>
        <td>{{ u.nome }}</td>
        <td>
          <div class="acoes">
            <button class="botao mini secundario" type="button"
                    onclick="editar({{ u.id }}, {{ u.nome | tojson }})">Editar</button>
            <form method="post" action="{{ url_for('cadastros.unidade_excluir', row_id=u.id) }}"
                  onsubmit="return confirm('Excluir a unidade {{ u.nome }}?');">
              <button class="botao mini perigo" type="submit">Excluir</button>
            </form>
          </div>
        </td>
      </tr>
      {% else %}
      <tr><td colspan="2" class="vazio">Nenhuma unidade cadastrada.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>

<script>
function editar(id, nome) {
  document.getElementById('unidade_id').value = id;
  document.getElementById('nome').value = nome;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function limpar() {
  document.getElementById('unidade_id').value = '';
  document.getElementById('nome').value = '';
}
</script>
{% endblock %}

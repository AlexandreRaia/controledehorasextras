{% extends "base.html" %}
{% import "macros.html" as m %}
{% block titulo %}{{ titulo }}{% endblock %}
{% block conteudo %}
<div class="cartao">
  <h1>{{ titulo }}</h1>
  <p class="sub">{{ mensagem }}</p>
  {% if detalhe %}<p class="dica">{{ detalhe }}</p>{% endif %}
  <p><a class="botao secundario so-icone" href="{{ url_for('relatorios.inicio') }}"
       title="Voltar ao início" aria-label="Voltar ao início">{{ m.icone('inicio') }}</a></p>
</div>
{% endblock %}
